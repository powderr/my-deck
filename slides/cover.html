<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Retrieval Quality — Cover</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{width:100%;height:100%;overflow:hidden;background:#22242C}
body{width:1280px;height:720px;overflow:hidden;position:absolute;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;background:#22242C;color:#fff;display:flex;flex-direction:column;justify-content:center;padding:0 90px}
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(rgba(255,255,255,0.04) 1px,transparent 1px);background-size:28px 28px;pointer-events:none}

/* Elastic teal left bar */
.bar{position:fixed;top:0;left:0;width:5px;height:100%;background:linear-gradient(to bottom,#0077CC,#00BFB3)}

/* Glow orb top-right */
.orb{position:fixed;top:-120px;right:-120px;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(0,119,204,0.18) 0%,rgba(0,191,179,0.08) 45%,transparent 70%);pointer-events:none}

@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.f1{opacity:0;animation:up .55s ease forwards .1s}
.f2{opacity:0;animation:up .55s ease forwards .32s}
.f3{opacity:0;animation:up .55s ease forwards .54s}
.f4{opacity:0;animation:up .55s ease forwards .72s}

.badge{display:inline-flex;align-items:center;gap:8px;background:rgba(0,119,204,0.15);border:1px solid rgba(0,119,204,0.35);border-radius:100px;padding:6px 18px;font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#1BA9F5;margin-bottom:28px}
.badge-dot{width:6px;height:6px;border-radius:50%;background:#1BA9F5;box-shadow:0 0 8px #1BA9F5}

h1{font-size:4.8rem;font-weight:900;letter-spacing:-.04em;line-height:1.07;margin-bottom:20px;max-width:760px}
h1 em{font-style:normal;color:#00BFB3}

.sub{font-size:1.22rem;font-weight:300;color:rgba(255,255,255,.5);max-width:580px;line-height:1.65;margin-bottom:52px}

.meta{display:flex;align-items:center;gap:14px}
.elastic-logo{height:28px;width:auto;opacity:.55}
.meta-text{font-size:.9rem;font-weight:600;color:rgba(255,255,255,.45);letter-spacing:.02em}
</style>
</head>

<div class="bar"></div>
<div class="orb"></div>

<div class="badge f1"><span class="badge-dot"></span>Elastic · AI Search</div>
